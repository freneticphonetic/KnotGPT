<svg xmlns="http://www.w3.org/2000/svg" class="logo"
           viewBox="0 0 1030 780"
           role="img"
           aria-labelledby="logoTitle logoDesc">
        <title id="logoTitle">KnotGPT</title>
        <desc id="logoDesc">
          Purple interwoven knot held by three fingers on each side.
        </desc>


