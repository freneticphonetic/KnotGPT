<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KnotGPT — traced vector splash</title>

<style>
  :root {
    --ink:#17111c;
    --muted:#72527f;
  }

  * { box-sizing:border-box; }

  html, body {
    width:100%;
    min-height:100%;
    margin:0;
  }

  body {
    min-height:100svh;
    overflow:hidden;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system,
                BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:#eed4fb;
  }

  .splash {
    position:relative;
    min-height:100svh;
    display:grid;
    place-items:center;
    overflow:hidden;
    isolation:isolate;

    background:
      radial-gradient(circle at 50% 39%,
        rgba(255,255,255,.92) 0 7%,
        rgba(255,255,255,.45) 25%,
        transparent 52%),
      linear-gradient(145deg,
        #fbf2ff 0%,
        #efd8fb 48%,
        #d9b0f5 100%);
  }

  .splash::before,
  .splash::after {
    content:"";
    position:absolute;
    width:62vmax;
    aspect-ratio:1;
    border:clamp(28px,5.6vw,84px) solid rgba(123,22,163,.095);
    border-radius:31%;
    transform:rotate(31deg);
    z-index:-1;
  }

  .splash::before {
    top:-32vmax;
    left:-30vmax;
  }

  .splash::after {
    right:-33vmax;
    bottom:-33vmax;
  }

  .stage {
    width:min(92vw, 620px);
    display:grid;
    justify-items:center;
    gap:clamp(8px,1.6vh,18px);
    transform:translateY(-2vh);
  }

  .logo-shell {
    width:min(92vw, 570px);
    filter:drop-shadow(0 22px 28px rgba(96,35,119,.20));
    animation:
      logo-in 1200ms cubic-bezier(.16,.88,.22,1) both,
      idle-float 4.5s 1500ms ease-in-out infinite;
  }

  .logo {
    display:block;
    width:100%;
    overflow:visible;
  }

  .logo #knot,
  .logo #leftHand,
  .logo #rightHand {
    transform-box:fill-box;
    transform-origin:center;
  }

  .logo #knot {
    animation:
      knot-settle 1200ms 100ms cubic-bezier(.18,.8,.18,1) both;
  }

  .logo #leftHand {
    animation:
      left-hug 980ms 360ms cubic-bezier(.18,.92,.22,1.12) both;
  }

  .logo #rightHand {
    animation:
      right-hug 980ms 360ms cubic-bezier(.18,.92,.22,1.12) both;
  }

  .logo .finger {
    transform-box:fill-box;
    transform-origin:center;
  }

  .logo .left-top,
  .logo .right-top {
    animation:finger-settle 720ms 610ms ease-out both;
  }

  .logo .left-middle,
  .logo .right-middle {
    animation:finger-settle 720ms 690ms ease-out both;
  }

  .logo .left-bottom,
  .logo .right-bottom {
    animation:finger-settle 720ms 770ms ease-out both;
  }

  .wordmark {
    color:var(--ink);
    font-size:clamp(48px,11vw,82px);
    font-weight:900;
    line-height:.9;
    letter-spacing:-.055em;
    opacity:0;
    transform:translateY(14px);
    animation:text-in 650ms 1000ms ease-out forwards;
  }

  .wordmark sup {
    font-size:.27em;
    vertical-align:top;
    margin-left:.08em;
    letter-spacing:0;
  }

  .tagline {
    margin:.6rem 0 0;
    color:var(--muted);
    font-size:clamp(15px,3.8vw,21px);
    font-weight:650;
    letter-spacing:.035em;
    opacity:0;
    transform:translateY(8px);
    animation:text-in 650ms 1160ms ease-out forwards;
  }

  .spark {
    position:absolute;
    width:11px;
    height:11px;
    background:rgba(255,255,255,.88);
    border-radius:2px;
    transform:rotate(45deg) scale(0);
    animation:twinkle 3.4s ease-in-out infinite;
  }

  .spark.one { left:19%; top:27%; animation-delay:1.25s; }
  .spark.two { right:17%; top:34%; animation-delay:1.9s; }
  .spark.three { left:27%; bottom:21%; animation-delay:2.45s; }

  .install-button {
    appearance:none;
    border:0;
    border-radius:999px;
    padding:12px 20px;
    margin-top:.35rem;
    background:linear-gradient(135deg, #9d19d2, #72109b);
    color:#fff;
    font:800 15px/1 system-ui, sans-serif;
    letter-spacing:.01em;
    box-shadow:0 10px 24px rgba(111,22,148,.22);
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    animation:install-in 500ms 1320ms ease-out forwards;
  }

  .install-button[hidden] {
    display:none;
  }

  .install-button:active {
    transform:translateY(1px) scale(.985);
  }

  .replay {
    position:fixed;
    right:max(16px, env(safe-area-inset-right));
    bottom:max(16px, env(safe-area-inset-bottom));
    z-index:5;
    appearance:none;
    border:0;
    border-radius:999px;
    padding:11px 17px;
    background:rgba(30,17,32,.80);
    color:white;
    font:750 14px/1 system-ui,sans-serif;
    backdrop-filter:blur(14px);
    box-shadow:0 6px 18px rgba(32,12,38,.16);
    cursor:pointer;
  }

  @keyframes logo-in {
    0%   { opacity:0; transform:scale(.80) translateY(30px); }
    62%  { opacity:1; transform:scale(1.025) translateY(-3px); }
    100% { opacity:1; transform:scale(1) translateY(0); }
  }

  @keyframes knot-settle {
    0%   { transform:rotate(-7deg) scale(.93); }
    72%  { transform:rotate(1.2deg) scale(1.012); }
    100% { transform:rotate(0) scale(1); }
  }

  @keyframes left-hug {
    0%   { opacity:.15; transform:translateX(-92px) rotate(-8deg); }
    72%  { opacity:1; transform:translateX(7px) rotate(1.5deg); }
    100% { opacity:1; transform:translateX(0) rotate(0); }
  }

  @keyframes right-hug {
    0%   { opacity:.15; transform:translateX(92px) rotate(8deg); }
    72%  { opacity:1; transform:translateX(-7px) rotate(-1.5deg); }
    100% { opacity:1; transform:translateX(0) rotate(0); }
  }

  @keyframes finger-settle {
    0%   { transform:scale(.94); }
    60%  { transform:scale(1.025); }
    100% { transform:scale(1); }
  }

  @keyframes text-in {
    to { opacity:1; transform:translateY(0); }
  }

  @keyframes idle-float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
  }

  @keyframes twinkle {
    0%,18%,100% { opacity:0; transform:rotate(45deg) scale(0); }
    38%,55%     { opacity:.9; transform:rotate(45deg) scale(1); }
    72%         { opacity:0; transform:rotate(45deg) scale(.25); }
  }

  @keyframes install-in {
    to {
      opacity:1;
      transform:translateY(0);
    }
  }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

    <stop offset="100%" stop-color="#e4baf6"/>

  <filter id="logoShadow" x="-25%" y="-25%" width="150%" height="160%">

    <p class="tagline">untangle the thread</p>

    <button
      id="installButton"
      class="install-button"
      type="button"
      hidden
    >
      Install App
    </button>
  </section>

  <button class="replay" type="button" id="replay">Replay</button>
</main>

<script>
  const replay = document.getElementById("replay");

  replay.addEventListener("click", () => {
    const oldStage = document.getElementById("stage");
    const freshStage = oldStage.cloneNode(true);
    oldStage.replaceWith(freshStage);
  });

  let installPrompt;

  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();

    installPrompt = event;

    document
      .getElementById("installButton")
      .hidden = false;
  });

  document
    .getElementById("installButton")
    .addEventListener("click", async () => {
      if (!installPrompt) return;

      const result = await installPrompt.prompt();

      console.log("Install result:", result.outcome);

      installPrompt = null;

      document
        .getElementById("installButton")
        .hidden = true;
    });

  window.addEventListener("appinstalled", () => {
    installPrompt = null;

    document
      .getElementById("installButton")
      .hidden = true;
  });
</script>

</html>
